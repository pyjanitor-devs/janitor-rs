name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: install NumPy for wrapper tests
        run: python -m pip install numpy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      # Standalone tests link against libpython. Wheel builds set
      # PYO3_BUILD_EXTENSION_MODULE through maturin.
      # No `--all-targets` here: that would also compile (but not run,
      # since criterion benches aren't `#[test]`s) benches/kernels.rs under
      # the `test` profile, which is wasted work -- the `cargo bench
      # --no-run` step below already compiles it, under the `bench`
      # profile it actually ships with, so nothing from a `test`-profile
      # compile of it could be reused there anyway.
      - name: cargo test (kernel unit tests)
        run: cargo test

      # Clippy performs static analysis only, it never links a binary.
      - name: cargo clippy (full feature set, no linking required)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Compiles the benchmark harness without running the full suite, to
      # keep CI fast -- `cargo bench` itself is for local use (see
      # README.md) when actually comparing algorithm timings.
      - name: cargo bench --no-run (compile-check only)
        run: cargo bench --no-run
