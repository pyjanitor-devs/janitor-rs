[package]
name = "janitor-rs"
version = "0.6.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "janitor_rs"
# "rlib" is added alongside "cdylib" only so `benches/kernels.rs` (and
# `cargo test`'s own harness) can link against this crate as an ordinary
# Rust library. It has no effect on the shipped Python extension module --
# maturin only ever picks up the "cdylib" artifact for the wheel.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.30"
numpy = "0.30"

# Maturin sets `PYO3_BUILD_EXTENSION_MODULE=1` for wheel builds. Keeping that
# setting out of Cargo features avoids PyO3's deprecated `extension-module` and
# `generate-import-lib` features while preserving the wheel link behavior.

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# `harness = false` hands control to criterion's own `main` (via
# `criterion_main!` in benches/kernels.rs) instead of Rust's built-in,
# libtest-based bench harness (which is nightly-only and not what we use).
[[bench]]
name = "kernels"
harness = false
